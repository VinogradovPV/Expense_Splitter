name: Build Release

on: 
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      run: PYTHONPATH=src python3 -m pytest tests/

    - name: Build with PyInstaller (Linux)
      run: ./scripts/build-unix.sh

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: expense-splitter-linux
        path: expense-splitter/dist/

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      run: PYTHONPATH=src python3 -m pytest tests/

    - name: Build with PyInstaller (Windows)
      run: |
        .\scripts\build-windows.ps1

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: expense-splitter-windows
        path: expense-splitter/dist/

  release:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4

    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/expense-splitter-linux/expense-splitter
        asset_name: expense-splitter-linux
        asset_content_type: application/octet-stream

    - name: Upload Release Assets (Launcher Linux)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/expense-splitter-linux/expense-splitter-launcher
        asset_name: expense-splitter-launcher-linux
        asset_content_type: application/octet-stream

    - name: Upload Release Assets (Windows CLI)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/expense-splitter-windows/expense-splitter.exe
        asset_name: expense-splitter-windows.exe
        asset_content_type: application/vnd.microsoft.portable-executable

    - name: Upload Release Assets (Windows Launcher)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/expense-splitter-windows/expense-splitter-launcher.exe
        asset_name: expense-splitter-launcher-windows.exe
        asset_content_type: application/vnd.microsoft.portable-executable
