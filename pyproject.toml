[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-splitter"
version = "0.1.0"
description = "CLI tool for splitting shared expenses among a group of participants"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "pyinstaller>=6"
]

[project.scripts]
expense-splitter = "expense_splitter.__main__:main"
expense-splitter-launcher = "expense_splitter.launcher:main"
expense-splitter-gui = "expense_splitter.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
